[package]
name = "afterglow"
version = "0.1.6"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/AeoryUX/afterglow"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-single-instance = "2"

tiny_http = "0.12"
percent-encoding = "2"
getrandom = "0.3"

webkit2gtk = { version = "2", features = ["v2_40"] }

[patch.crates-io]
glib = { path = "vendor/glib" }
